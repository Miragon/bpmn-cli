# Checks every pull request (including release-please's release PRs) and every push to main:
# the guardrails (`npm run gate`), the manifests of the Claude Code plugin and its
# marketplace (`claude plugin validate`), and the corporate identity of the docs (the vendored docs
# kit and brand-lint). The gate's checkout is the pull request's head with full history, so the
# timings find main at the commit the branch sits on.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate

  # plugins/bpmn-cli and .claude-plugin/marketplace.json. Validation is local: no login, no API key.
  # Claude Code is pinned so that a new release's checks do not fail an unrelated pull request;
  # bump it from time to time (`npm view @anthropic-ai/claude-code dist-tags`).
  plugin:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate --strict plugins/bpmn-cli
      - run: claude plugin validate --strict .

  # The corporate identity: the docs kit in docs/.vitepress/miragon/ equals the release of
  # Miragon/corporate-identity it was vendored from, and brand-lint finds no hard violation in the
  # docs and the README (rules and exceptions in .miragon/brand.json). That repo is private: without
  # the secret (not set up yet, or a pull request from a fork) the job warns and skips; the docs
  # workflow still checks the kit against its own manifest.
  brand:
    runs-on: ubuntu-latest
    env:
      CI_SOURCE_TOKEN: ${{ secrets.CORPORATE_IDENTITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: No access to Miragon/corporate-identity
        if: env.CI_SOURCE_TOKEN == ''
        run: echo "::warning title=Brand checks skipped::CORPORATE_IDENTITY_READ_TOKEN is not set, so the docs kit is not compared with Miragon/corporate-identity and brand-lint does not run. Add the secret (contents:read on Miragon/corporate-identity)."

      # Keep ref on the release in docs/.vitepress/miragon/manifest.json.
      - uses: actions/checkout@v7
        if: env.CI_SOURCE_TOKEN != ''
        with:
          repository: Miragon/corporate-identity
          ref: v1.26.0
          token: ${{ env.CI_SOURCE_TOKEN }}
          path: .ci-source
          sparse-checkout: plugins/miragon-brand
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: env.CI_SOURCE_TOKEN != ''
        with:
          node-version: 24

      - name: The docs kit equals the CI release
        if: env.CI_SOURCE_TOKEN != ''
        run: node docs/.vitepress/miragon/check.mjs --ci .ci-source

      - name: brand-lint
        if: env.CI_SOURCE_TOKEN != ''
        run: node .ci-source/plugins/miragon-brand/scripts/brand-lint.mjs --nur-hart docs README.md

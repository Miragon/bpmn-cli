# Checks every pull request (including release-please's release PRs) and every push to main:
# typecheck, build, tests, the layout-regression budget and a short seeded fuzz run (`npm run gate`).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run gate

name: docs

# The docs (docs/) as a VitePress site on GitHub Pages: https://miragon.github.io/bpmn-cli/.
# A pull request that touches docs/ checks the vendored Miragon docs kit and builds the site
# (VitePress fails the build on a dead link). A push to main also deploys it.
# Template from Miragon/corporate-identity (skill docs-site).
# One-time repo setting: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# No permissions by default; each job asks for what it needs.
permissions: {}

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history: VitePress reads "last updated" from git.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      # The kit in docs/.vitepress/miragon/ and the logos in docs/public/logo/ come unchanged
      # from the corporate identity. Fails when someone edited them in this repo.
      - name: Check the Miragon docs kit
        run: node .vitepress/miragon/check.mjs
        working-directory: docs

      - run: npm run build
        working-directory: docs
        env:
          # Project pages are served under /<repo>/; the kit sets VitePress' base from it
          # (local dev and preview keep "/").
          DOCS_BASE: /bpmn-cli/

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time; a queued deploy finishes instead of being cancelled.
    # Builds of pull requests never wait for it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

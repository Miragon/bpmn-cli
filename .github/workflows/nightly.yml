# Rare crashes and slow drift: a fuzz with a new seed every night and the bench against main, both
# scored by main's scorers in the worktree tools/oracle builds. GitHub starts a schedule only from the
# default branch, so until the rebuild is merged this runs on a tag v1.0.0-rc.N or by hand.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  push:
    tags: ['v1.0.0-rc.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run fuzz -- --walks 60 --steps 30 --seed ${{ github.run_number }} --hard warn --minimize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz
          path: tools/fuzz/out/latest/
          if-no-files-found: ignore

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            tools/bench/results/latest/*.jsonl
            tools/bench/results/latest/meta.json
          if-no-files-found: ignore

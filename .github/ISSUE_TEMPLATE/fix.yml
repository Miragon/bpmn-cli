name: Bug Report
description: Report a bug or unexpected behaviour in @miragon/bpmn-cli
title: '[Fix]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below to help us reproduce and fix the issue.
        Attaching the `.bpmn` file is by far the fastest path to a fix.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The exact commands (or the ops JSON passed to `bpmn apply`) and the `.bpmn` file they ran on.
      placeholder: |
        1. bpmn new order.bpmn --name "Order handling"
        2. bpmn add order.bpmn ...
        3. Observe the following error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the CLI output (`--json` if possible) or a rendered image (`bpmn render`).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bpmn-cli Version
      description: The output of `bpmn --version`.
      placeholder: '0.5.0'
    validations:
      required: false

  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Plain BPMN
        - Camunda 7
        - Camunda 8
    validations:
      required: false
